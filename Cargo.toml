[package]
name = "dackel-launcher"
description = "Launch Windows games with Proton, with gamepad support"
license = "MIT"
repository = "https://github.com/dasbd72/dackel-launcher"
version = "0.1.8"
edition = "2024"

[dependencies]
eframe = "0.36.2"
encoding_rs = "0.8.42"
egui_extras = { version = "0.36.2", features = ["all_loaders"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.4.2"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "ico"] }
gilrs = "0.11.2"
libc = "0.2.190"
egui-file-dialog = "0.15.0"
pelite = "0.10.0"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
